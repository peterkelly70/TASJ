[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasj"
version = "0.1.0"
description = "AI-integrated database for Traveller Campaigns"
readme = "README.md"
authors = [
    {name = "Peter Kelly", email = "your.email@example.com"}
]
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "PyQt5>=5.15.0",
    "python-dotenv>=0.19.0",
    "mysql-connector-python>=8.0.26",
    "requests>=2.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["tasj"]
omit = [
    "tests/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
